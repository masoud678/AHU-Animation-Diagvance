<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Air Handling Unit | Diagvance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1822; --panel:#15232F; --line:#2A3B4A; --steel:#8FA3B3;
    --text:#E6EDF2; --muted:#8EA0AE; --cold:#3D8BFF; --warm:#FFA640; --hot:#FF4D4D;
  }
  *{box-sizing:border-box}
  :root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0;background:var(--ink);color:var(--text);font-family:"Barlow",system-ui,sans-serif}
  .ahu{max-width:1100px;margin:0 auto;padding:28px 24px 32px}
  .head{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
  .head h1{font-size:28px;font-weight:600;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
  .head p{margin:0;color:var(--muted);font-size:16px;line-height:1.5;max-width:52ch}
  .controls{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center}
  .seg{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
  .seg button{position:relative;z-index:1;background:none;border:0;color:var(--muted);font:500 15px "Barlow",sans-serif;padding:9px 22px;border-radius:999px;cursor:pointer;transition:color .25s}
  .seg button[aria-pressed="true"]{color:#fff}
  .seg button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
  .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--cold);transition:transform .35s cubic-bezier(.4,1.3,.5,1),background .35s}
  .seg.heat .thumb{transform:translateX(100%);background:var(--hot)}
  .oa{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted)}
  .oa output{font:600 18px "Barlow Condensed",sans-serif;color:var(--text);min-width:44px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:160px;height:6px;border-radius:3px;background:var(--line);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--text);border:4px solid var(--ink);box-shadow:0 0 0 1px var(--steel);cursor:pointer}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--text);border:4px solid var(--ink);cursor:pointer}
  input[type=range]:focus-visible{outline:2px solid var(--text);outline-offset:4px}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  svg{display:block;width:100%;height:auto}
  .lab{fill:var(--muted);font:500 15px "Barlow",sans-serif}
  .tagt{fill:var(--text);font:600 15px "Barlow Condensed",sans-serif}
  .foot{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between;margin-top:16px}
  .scale{display:flex;align-items:center;gap:10px;font:500 14px "Barlow Condensed",sans-serif;color:var(--muted)}
  .bar{width:220px;height:8px;border-radius:4px;background:linear-gradient(90deg,#2F7BFF,#6FB6FF 49%,#B9D3E6 67%,#FFA640 76%,#FF4D4D)}
  .note{font-size:15px;color:var(--muted);margin:0;max-width:60ch;line-height:1.5}
  .glow-hot{filter:drop-shadow(0 0 10px rgba(255,77,77,.55))}
  .glow-cold{filter:drop-shadow(0 0 10px rgba(61,139,255,.55))}
  #fan{transform-box:view-box;transform-origin:610px 285px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes blink{50%{opacity:.25}}
  .led{animation:blink 1.6s steps(1) infinite}
  @media (prefers-reduced-motion:reduce){#fan,.led{animation:none}}
  @media (max-width:640px){.head h1{font-size:23px}.ahu{padding:20px 14px}input[type=range]{width:120px}}
</style>
</head>
<body>
<div class="ahu">
  <div class="head">
    <div>
      <h1>How an air handling unit conditions air</h1>
      <p>Outdoor and return air mix, pass the filter and coils, and leave as supply air. Switch the mode and open the outdoor air damper to see the temperatures change.</p>
    </div>
    <div class="controls">
      <div class="seg" id="seg" role="group" aria-label="Operating mode">
        <span class="thumb" aria-hidden="true"></span>
        <button id="bc" aria-pressed="true">Cooling</button>
        <button id="bh" aria-pressed="false">Heating</button>
      </div>
      <label class="oa" for="oa">Outdoor air
        <input type="range" id="oa" min="10" max="100" step="5" value="30">
        <output id="oav">30%</output>
      </label>
    </div>
  </div>

  <div class="stage">
  <svg viewBox="0 0 900 490" role="img" aria-labelledby="t d">
    <title id="t">Air handling unit cross section</title>
    <desc id="d">Animated airflow through mixing dampers, filter, heating coil, cooling coil and supply fan, with temperature sensors.</desc>
    <defs>
      <pattern id="fins" width="7" height="10" patternUnits="userSpaceOnUse"><line x1="3.5" y1="0" x2="3.5" y2="10" stroke="rgba(255,255,255,.28)" stroke-width="1.2"/></pattern>
    </defs>
    <g fill="none" stroke="#5A6E7E" stroke-width="2.5" stroke-linejoin="round">
      <path d="M50 170 V50 M120 170 V50"/>
      <path d="M190 170 V30 M260 30 V80 H340 V30 M260 170 V120 H410 V30"/>
      <path d="M50 170 H40 Q30 170 30 180 V390 Q30 400 40 400 H750 Q760 400 760 390 V340 H880 M880 230 H760 V180 Q760 170 750 170 H260 M190 170 H120"/>
    </g>
    <text class="lab" x="85" y="38" text-anchor="middle">Outdoor air</text>
    <text class="lab" x="225" y="20" text-anchor="middle">Return air</text>
    <text class="lab" x="375" y="20" text-anchor="middle">Exhaust air</text>
    <text class="lab" x="820" y="215" text-anchor="middle">Supply air</text>

    <g id="dOA" stroke="#B9C7D2" stroke-width="4" stroke-linecap="round"></g>
    <g id="dRA" stroke="#B9C7D2" stroke-width="4" stroke-linecap="round"></g>

    <polyline points="296,180 318,194 296,208 318,222 296,236 318,250 296,264 318,278 296,292 318,306 296,320 318,334 296,348 318,362 296,376 318,390" fill="none" stroke="#7FD1B9" stroke-width="2"/>
    <text class="lab" x="307" y="158" text-anchor="middle">Filter</text>

    <g id="hcg"><rect id="hc" x="350" y="180" width="50" height="210" rx="4"/><rect x="350" y="180" width="50" height="210" rx="4" fill="url(#fins)"/></g>
    <text class="lab" x="375" y="158" text-anchor="middle">Heating coil</text>
    <g id="ccg"><rect id="cc" x="440" y="180" width="50" height="200" rx="4"/><rect x="440" y="180" width="50" height="200" rx="4" fill="url(#fins)"/></g>
    <text class="lab" x="465" y="158" text-anchor="middle">Cooling coil</text>
    <rect x="430" y="382" width="70" height="10" rx="2" fill="#5A6E7E"/>
    <path d="M492 392 V440 H560" fill="none" stroke="#5A6E7E" stroke-width="6" stroke-linecap="round"/>
    <text class="lab" x="570" y="445">Condensate drain</text>

    <circle cx="610" cy="285" r="80" fill="none" stroke="#5A6E7E" stroke-width="2.5"/>
    <g id="fan" fill="none" stroke="#B9C7D2" stroke-width="5" stroke-linecap="round"></g>
    <circle cx="610" cy="285" r="14" fill="#5A6E7E"/>
    <text class="lab" x="610" y="158" text-anchor="middle">Supply fan</text>
    <text class="lab" x="155" y="425" text-anchor="middle">Mixing dampers</text>

    <g id="p"></g>

    <g id="sensors"></g>

    <g transform="translate(700 412)">
      <rect width="170" height="66" rx="8" fill="#0E1822" stroke="#2A3B4A"/>
      <circle class="led" cx="18" cy="18" r="5" fill="#46D39A"/>
      <text class="tagt" x="32" y="23">BAS controller</text>
      <text id="bas1" class="lab" x="14" y="50" style="font-size:14px">Cooling, OA damper 30%</text>
    </g>
  </svg>
  </div>

  <div class="foot">
    <div class="scale"><span>-10°C</span><span class="bar" aria-hidden="true"></span><span>35°C</span></div>
    <p class="note" id="note"></p>
  </div>
</div>

<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const SET={c:{OAT:32,RAT:24,SAT:13},h:{OAT:-5,RAT:21,SAT:35}};
  const NOTES={
    c:'Cooling: the chilled coil removes heat and moisture. Water condenses on the fins and drains away.',
    h:'Heating: cold outdoor air is mixed with warm return air, then the heating coil raises it to supply temperature.'
  };
  let mode='c', oa=.3;
  const $=id=>document.getElementById(id);
  const P=$('p');
  function mk(tag,parent,a){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);parent.appendChild(e);return e}

  const STOPS=[[-10,[47,123,255]],[12,[111,182,255]],[20,[185,211,230]],[24,[255,166,64]],[35,[255,77,77]]];
  function tcol(t){
    if(t<=STOPS[0][0])return rgb(STOPS[0][1]);
    for(let i=1;i<STOPS.length;i++){if(t<=STOPS[i][0]){const [t0,c0]=STOPS[i-1],[t1,c1]=STOPS[i],f=(t-t0)/(t1-t0);return rgb(c0.map((v,j)=>v+(c1[j]-v)*f))}}
    return rgb(STOPS[STOPS.length-1][1]);
  }
  function rgb(c){return 'rgb('+c.map(Math.round).join(',')+')'}

  for(let i=0;i<8;i++){const a=i*Math.PI/4;mk('path',$('fan'),{d:'M'+(610+18*Math.cos(a))+' '+(285+18*Math.sin(a))+' Q'+(610+50*Math.cos(a+.5))+' '+(285+50*Math.sin(a+.5))+' '+(610+64*Math.cos(a+.2))+' '+(285+64*Math.sin(a+.2))})}

  const blades={OA:[],RA:[]};
  [['OA',85],['RA',225]].forEach(([k,cx])=>[132,146,160].forEach(y=>blades[k].push({e:mk('line',$('d'+k),{x1:cx-28,y1:y,x2:cx+28,y2:y}),cx,y})));
  function setBlades(){
    blades.OA.forEach(b=>b.e.setAttribute('transform','rotate('+(oa*70)+' '+b.cx+' '+b.y+')'));
    blades.RA.forEach(b=>b.e.setAttribute('transform','rotate('+((1-oa)*70)+' '+b.cx+' '+b.y+')'));
  }

  const SENS=[
    {k:'OAT',dx:85,dy:95,tx:122,ty:83},
    {k:'RAT',dx:225,dy:55,tx:264,ty:40},
    {k:'MAT',dx:330,dy:394,tx:290,ty:408},
    {k:'SAT',dx:845,dy:285,tx:790,ty:352}
  ];
  SENS.forEach(s=>{
    mk('circle',$('sensors'),{cx:s.dx,cy:s.dy,r:5,fill:'#E6EDF2',stroke:'#0E1822','stroke-width':2});
    const g=mk('g',$('sensors'),{transform:'translate('+s.tx+' '+s.ty+')'});
    mk('rect',g,{width:66,height:26,rx:5,fill:'#0E1822',stroke:'#2A3B4A'});
    s.dot=mk('circle',g,{cx:11,cy:13,r:4});
    s.txt=mk('text',g,{class:'tagt',x:20,y:18,style:'font-size:14px'});
  });

  function temps(){const s=SET[mode];return{OAT:s.OAT,RAT:s.RAT,MAT:oa*s.OAT+(1-oa)*s.RAT,SAT:s.SAT}}

  function update(){
    const T=temps();
    SENS.forEach(s=>{s.txt.textContent=s.k+' '+Math.round(T[s.k])+'°';s.dot.setAttribute('fill',tcol(T[s.k]))});
    const heat=mode==='h';
    $('hc').setAttribute('fill',heat?'#B83A3A':'#34495A');
    $('cc').setAttribute('fill',heat?'#34495A':'#2563C9');
    $('hcg').setAttribute('class',heat?'glow-hot':'');
    $('ccg').setAttribute('class',heat?'':'glow-cold');
    $('seg').classList.toggle('heat',heat);
    $('bc').setAttribute('aria-pressed',!heat);$('bh').setAttribute('aria-pressed',heat);
    $('bas1').textContent=(heat?'Heating':'Cooling')+', OA damper '+Math.round(oa*100)+'%';
    $('note').textContent=NOTES[mode];
    $('oav').textContent=Math.round(oa*100)+'%';
    setBlades();
  }
  $('bc').onclick=()=>{mode='c';update()};
  $('bh').onclick=()=>{mode='h';update()};
  $('oa').oninput=e=>{oa=e.target.value/100;update()};

  const main=[];
  function spawn(a,scatter){
    a.src=Math.random()<oa?'OAT':'RAT';a.v=1.6+Math.random()*1.1;a.ty=188+Math.random()*190;a.ph='down';
    if(a.src==='OAT'){a.x=56+Math.random()*58;a.y=45}else{a.x=196+Math.random()*58;a.y=28}
    if(scatter){a.ph='right';a.x=40+Math.random()*830;a.y=a.ty}
  }
  for(let i=0;i<90;i++){const a={e:mk('circle',P,{r:4.2})};spawn(a,true);main.push(a)}
  const ex=[];
  function resetEx(a){a.x=196+Math.random()*58;a.y=28;a.ph='down';a.v=1.4+Math.random()*.8;a.ty=88+Math.random()*24;a.tx=348+Math.random()*54}
  for(let i=0;i<16;i++){const a={e:mk('circle',P,{r:4.2})};resetEx(a);a.y=28+Math.random()*60;ex.push(a)}
  const drops=[];
  for(let i=0;i<10;i++)drops.push({e:mk('circle',P,{r:2.6,fill:'#6FB6FF'}),x:446+Math.random()*38,y:300+Math.random()*80});

  function temp(a){
    const T=temps();
    if(a.ph==='down'||a.x<320)return T[a.src];
    if(mode==='c')return a.x>490?T.SAT:T.MAT;
    return a.x>400?T.SAT:T.MAT;
  }

  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let last=performance.now();
  function frame(now){
    const k=Math.min(3,(now-last)/16.7);last=now;
    for(const a of main){
      if(a.ph==='down'){a.y+=a.v*k;if(a.y>=172)a.ph='right'}
      else{
        a.x+=a.v*1.3*k;a.y+=(a.ty-a.y)*.05*k;
        if(a.x>740){const lo=240,hi=330;a.ty=Math.min(hi,Math.max(lo,a.ty))}
        if(a.x>885)spawn(a,false);
      }
      a.e.setAttribute('cx',a.x.toFixed(1));a.e.setAttribute('cy',a.y.toFixed(1));a.e.setAttribute('fill',tcol(temp(a)));
    }
    const n=Math.round(oa*16),RAT=temps().RAT;
    ex.forEach((a,i)=>{
      if(a.ph==='down'){a.y+=a.v*k;if(a.y>=a.ty)a.ph='right'}
      else if(a.ph==='right'){a.x+=a.v*1.3*k;if(a.x>=a.tx)a.ph='up'}
      else{a.y-=a.v*1.4*k;if(a.y<6)resetEx(a)}
      a.e.setAttribute('cx',a.x.toFixed(1));a.e.setAttribute('cy',a.y.toFixed(1));a.e.setAttribute('fill',tcol(RAT));a.e.setAttribute('opacity',i<n?1:0);
    });
    for(const d of drops){d.y+=1.2*k;if(d.y>381){d.y=300;d.x=446+Math.random()*38}d.e.setAttribute('cx',d.x.toFixed(1));d.e.setAttribute('cy',d.y.toFixed(1));d.e.setAttribute('opacity',mode==='c'?.95:0)}
    if(!reduce)requestAnimationFrame(frame);
  }
  update();requestAnimationFrame(frame);

  function postHeight(){if(window.parent!==window)window.parent.postMessage({ahuHeight:document.documentElement.scrollHeight},'*')}
  window.addEventListener('load',postHeight);window.addEventListener('resize',postHeight);
})();
</script>
</body>
</html>
